name: ci
on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    strategy:
      matrix:
        python: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: pip install -r requirements-dev.txt
      - name: Lint (includes bandit-style security rules)
        run: ruff check app tests evals
      - name: Tests + coverage (80% overall)
        run: pytest --cov --cov-report=term --cov-fail-under=80
      - name: Coverage gate (90% on money + screener + security code)
        run: coverage report --include="app/screener/*,app/api/routes/positions.py,app/core/*,app/db/audit.py,app/reasoning/*" --fail-under=90
      - name: Evals (pricing / screener / reason validator, regression-gated)
        run: python -m evals.run
      - name: Dependency audit
        run: pip-audit -r requirements.txt

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      # --omit=dev: the only remaining high-severity finding is `braces`
      # (transitive via eslint-config-next), a dev-only glob-stack DoS with no
      # patched release yet. Production deps are audited in full.
      - run: npm audit --omit=dev --audit-level=high

  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
