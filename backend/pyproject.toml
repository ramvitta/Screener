[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::urllib3.exceptions.NotOpenSSLWarning",
    # starlette>=1.0 testclient prefers httpx2 over httpx; our tests mock the
    # HTTP layer with respx (httpx-only), so we keep httpx and silence the notice.
    "ignore::starlette.exceptions.StarletteDeprecationWarning",
]
addopts = "-q"

[tool.coverage.run]
source = ["app"]
omit = ["app/db/clickhouse.py", "app/api/routes/backfill.py", "app/api/routes/charts.py"]

[tool.ruff]
line-length = 140
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "S"]
ignore = ["E501", "B008", "S608"]  # S608: SQL f-strings only interpolate allowlisted column names

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106", "S311"]
"evals/**" = ["S101", "S311"]
